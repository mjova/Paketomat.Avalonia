#_preseed_V1
# Odgovori Debian instalera za paketomat (napravi-iso.sh ga stavlja u initrd ISO-a, doc/deploy-linux.md). Jedino pitanje
# koje ostaje je izbor diska koji se briše (toppos-early.sh), da slučajan boot sa USB-a ne obriše pogrešan računar.
# @…@ popunjava napravi-iso.sh.

# ─── Jezik, tastatura, vreme ─────────────────────────────────────────────────────────────────────────────────────────
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string RS
d-i localechooser/supported-locales multiselect en_US.UTF-8, sr_RS.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string Europe/Belgrade
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# ─── Mreža: isključena tokom instalacije ─────────────────────────────────────────────────────────────────────────────
# Svi paketi su na ISO-u. Bez mreže instaler ne može ni da učita tuđ preseed preko DHCP-a (mrežni preseed bi zamenio
# pravila za disk). Žičani interfejsi dobijaju DHCP na instaliranom sistemu (toppos-late.sh), čim se kabl priključi.
d-i netcfg/enable boolean false
# Ime menja podešavanje posle prvog boot-a (podesi-kiosk.sh).
d-i netcfg/get_hostname string paketomat
d-i netcfg/get_domain string
d-i netcfg/hostname string paketomat
# Firmver se ne traži po drugim medijima: ta pretraga montira particije unutrašnjih diskova (upis) pre pitanja o disku.
d-i hw-detect/load_firmware boolean false

# ─── Korisnici: root zaključan, servisni korisnik sa sudo ────────────────────────────────────────────────────────────
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Servis
d-i passwd/username string @KORISNIK@
d-i passwd/user-password-crypted password @LOZINKA_HES@
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# ─── Disk: jedino pitanje (toppos-early.sh, pre bilo kakve izmene): operater bira disk koji se briše ili „Prekini“ ─────
# Tek izbor diska postavlja način particionisanja, partman-auto/disk, grub-installer/bootdev i potvrde partman-a; dotle su
# potvrde „ne“, a svaki neuspeh skripte gasi računar, pa bez izbora nijedan disk ne može biti izmenjen. Ovde navedena
# pitanja postoje pre nego što ih toppos-early.sh postavi.
d-i partman/early_command string sh /toppos-early.sh
d-i partman-auto/method string
d-i partman-auto/disk string
d-i grub-installer/bootdev string
d-i partman/confirm boolean false
d-i partman/confirm_nooverwrite boolean false
d-i partman-auto/choose_recipe select atomic
# LVM i RAID se nikad ne uklanjaju automatski (toppos-early.sh odbija takav disk; ovo je druga ograda).
d-i partman-lvm/device_remove_lvm boolean false
d-i partman-lvm/device_remove_lvm_span boolean false
d-i partman-md/device_remove_md boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish

# ─── Paketi: samo osnovni sistem sa ISO-a; ostalo toppos-late.sh iz lokalnog repozitorijuma ──────────────────────────
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
tasksel tasksel/first multiselect
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# ─── GRUB: na izabrani disk (grub-installer/bootdev iz toppos-early.sh); kod UEFI-ja se ne pita ─────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false

# ─── Kraj: paketi kioska, pa gašenje (ponovni boot sa ISO-a bi ponovo pokrenuo instalaciju) ──────────────────────────
d-i preseed/late_command string sh /toppos-late.sh
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
