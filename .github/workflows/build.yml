name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Paketomat.slnx

      - name: Build
        run: dotnet build Paketomat.slnx -c Release --no-restore

      - name: Test
        # Test projekti jedan za drugim (-m:1): ECR kioska čeka odgovor u petlji bez pauze i za vreme POS E2E testova drži
        # jedno jezgro, pa bi paralelni projekti sa kratkim timeout-ima (HTTP 1 s, NCU24L) na CI mašini padali.
        run: dotnet test Paketomat.slnx -c Release --no-build -m:1
